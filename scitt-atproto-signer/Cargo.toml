[package]
name = "scitt-atproto-signer"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "AT Protocol XRPC service that registers SCITT Signed Statements and returns badge.blue inline attestations"
repository = "https://github.com/johnandersen777/scitt-atproto"
publish = false

[lib]
name = "scitt_atproto_signer"
path = "src/lib.rs"

[[bin]]
name = "scitt-atproto-signer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
atproto-attestation = { path = "../atproto-crates/crates/atproto-attestation" }
atproto-identity = { path = "../atproto-crates/crates/atproto-identity" }
atproto-record = { path = "../atproto-crates/crates/atproto-record" }
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4.5", features = ["derive", "env"] }
p256 = { version = "0.14", features = ["ecdsa"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 2
